name: Deploy

on:
  push:
    branches: [main]
  pull_request:

env:
  VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
  VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
  VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
  VITE_FIREBASE_STORAGE_BUCKET: ${{ vars.VITE_FIREBASE_STORAGE_BUCKET }}
  VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.VITE_FIREBASE_MESSAGING_SENDER_ID }}
  VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID }}
  VITE_ENABLE_APP_CHECK: ${{ vars.VITE_ENABLE_APP_CHECK }}
  VITE_FIREBASE_APP_CHECK_RECAPTCHA_SITE_KEY: ${{ vars.VITE_FIREBASE_APP_CHECK_RECAPTCHA_SITE_KEY }}
  VITE_ENABLE_APP_CHECK_IN_DEV: ${{ vars.VITE_ENABLE_APP_CHECK_IN_DEV }}
  VITE_ENABLE_OFFLINE_PERSISTENCE: ${{ vars.VITE_ENABLE_OFFLINE_PERSISTENCE }}
  VITE_ENABLE_FCM: ${{ vars.VITE_ENABLE_FCM }}
  VITE_FIREBASE_FCM_VAPID_KEY: ${{ vars.VITE_FIREBASE_FCM_VAPID_KEY }}
  VITE_LOG_LEVEL: ${{ vars.VITE_LOG_LEVEL }}

jobs:
  preview:
    if: github.event_name == 'pull_request' && github.repository == 'shawngenese/Interno'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      - run: npm i -g firebase-tools
      - run: firebase hosting:channel:deploy pr-${{ github.event.number }} --project interno-cec9f --expires 7d

  prod:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && github.repository == 'shawngenese/Interno'
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - run: npm ci --prefix functions
      - run: npm run build --prefix functions
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      - run: npm i -g firebase-tools
      - run: firebase deploy --project interno-cec9f
